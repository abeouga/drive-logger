# PR と main への push ごとに、テスト・型チェック・ビルド・Terraform の検証を回す。
# AWS には繋がない（鍵を置かない）。Terraform も backend なしで検証だけする。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 環境を作る（Lambda のコンテナと同じ版）
        run: |
          uv venv --python 3.12
          uv pip install -r deploy/lambda/requirements.txt pytest==9.2.0 jsonschema==4.26.0
          uv pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q

  api:
    name: api（pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q

  web:
    name: web（型チェック・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: contracts（定義と firmware の突き合わせ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with jsonschema==4.26.0 --with pytest==9.2.0 --with pyyaml==6.0.3 python -m pytest contracts/tests -q

  infra:
    name: infra（terraform fmt・validate）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
