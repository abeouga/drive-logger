# firmware/ を変えたときだけ、ESP32 のスケッチをコンパイルする（実機への書き込みはしない）。
# コアの版とボードの設定は firmware/ct125_logger/README.md のコンパイルの手順と同じ。
name: firmware

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

env:
  ESP32_CORE: "esp32:esp32@3.3.12"
  NIMBLE_LIB: "NimBLE-Arduino@2.5.2"
  # V3.8：loop() を core 0 で動かす（LoopCore=0。#132）。ECU の BLE（NimBLE）を入れると 1.25 MB を超えるので huge_app
  FQBN: "esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,FlashSize=4M,PartitionScheme=huge_app,LoopCore=0"

jobs:
  compile:
    name: firmware（コンパイル）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # ESP32 のコアと道具は数百 MB あるので、版ごとにキャッシュする
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-${{ env.ESP32_CORE }}
      - name: ESP32 のコアを入れる
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "$ESP32_CORE" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      # ECU のアダプターに BLE でつなぐ（V3.8）。標準の BLE（Bluedroid）は約 9 万バイト使い、記録中に入らないため
      - name: ライブラリを入れる
        run: arduino-cli lib install "$NIMBLE_LIB"
      - name: コンパイル
        working-directory: firmware/ct125_logger
        run: arduino-cli compile --fqbn "$FQBN" --warnings default .

  host-test:
    name: firmware（PC で動かすテスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON の読み取り（json_lite.h）
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/tests/host -I firmware/ct125_logger firmware/tests/host/test_json_lite.cpp -o /tmp/test_json_lite
          /tmp/test_json_lite
      - name: 受け付けの応答の読み取り（upload_ticket.h）
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/tests/host -I firmware/ct125_logger firmware/tests/host/test_upload_ticket.cpp -o /tmp/test_upload_ticket
          /tmp/test_upload_ticket
      - name: SD に書けなくなった CSV の開き直し（sd_write_recovery.h）
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/tests/host -I firmware/ct125_logger firmware/tests/host/test_sd_write_recovery.cpp -o /tmp/test_sd_write_recovery
          /tmp/test_sd_write_recovery
      - name: ADXL345 の抜き差しの判定（adxl_link.h）
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/tests/host -I firmware/ct125_logger firmware/tests/host/test_adxl_link.cpp -o /tmp/test_adxl_link
          /tmp/test_adxl_link
      - name: ELM327 の命令の縛りと返事の読み取り（elm_parse.h）
        run: |
          g++ -std=c++17 -Wall -Werror -I firmware/tests/host -I firmware/ct125_logger firmware/tests/host/test_elm_parse.cpp -o /tmp/test_elm_parse
          /tmp/test_elm_parse
