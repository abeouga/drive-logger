name: Spike
description: 実装の前に、できるかどうかを短く調べて確かめる
title: "[Spike] "
labels:
  - Spike

body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: |
        3 段で書きます。1 段は 1 文です。
        1. 何ができるようになるか（「〜できるようにする」）
        2. なぜ要るか（根拠は Issue か docs/ へのリンクにする）
        3. どう進めるか（方針を 1 文で）
        完了条件は PR に書きます。関数名・ファイル名を並べたり、「〜は変えない」と断ったりしません。
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: 決めること
      description: 決まっていないことがあるときだけ書きます。番号付きのチェックボックスで並べ、決まったら [x] にしてどう決まったかを 1 行添えます。
      placeholder: |
        - [ ] 1. 
        - [ ] 2. 
