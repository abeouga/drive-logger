# 設定の既定値（根拠は docs/data_schema.md 6.）。PC ごとの値（AWS のバケット名など）は config/local.yaml（コミットしない）に置く。
window_sec: 1.0          # 1 秒窓、重なりなし（docs/analysis_policy.md 2.1）
edge_sec: 60             # 走行の先頭・末尾を is_edge=True にする秒数
clip_g: 15.9             # ADXL345 FULL_RES ±16g の上限（15.97 g）手前。これ以上は is_clipped
stop_speed_kmh: 5        # 停止判定（停止中でも GPS 速度が 0〜4 km/h 出る）。contracts/common.json と同じ値（firmware も使う）
upload:                  # PC から SD の走行を送る（python -m ct125 upload-sd。ESP32 と同じデバイス API を通す）
  base_url: https://drive.herdio-system.com
  device_id: pc01
  token_file: config/pc01.token   # register-device --id pc01 --token-file config/pc01.token で作る（*.token はコミットしない）
classify:                # 走行の分類（docs/data_flow_design.md 9.）。変えたら全走行を分類し直す（retrain）
  desk_vib_median_g: 0.05   # 振動（1 秒窓の rms）の中央値がこれ未満なら机上（エンジン停止 約 0.015 g、アイドリング 約 0.13 g）
  move_dist_m: 200          # GPS で始点からこれ以上動いたら「動いた」
  min_moving_windows: 60    # 実走：止まる速さ以上の窓がこれ以上
  min_gps_windows: 60       # 停車：GPS のある窓がこれ以上で、動いていない
  train_kinds: [idle, ride] # 学習に使う分類（机上と GPS なしは使わない）
  hidden_kinds: [desk]      # 画面に出さない分類
gps:
  min_sats: 5            # これ未満の行は無効（ride_004 の 100 km/h 誤測位は sats 3〜4）
  max_hdop: 5.0          # これを超える行は無効
  max_jump_mps: 50       # 1 秒で 50 m 以上飛ぶ点は無効（時速 180 km 相当）
  max_speed_mismatch_kmh: 25  # RMC の速度と、直前 fix からの距離で求めた速度の差がこれを超える行は無効
  max_speed_kmh: null    # 速度の上限（null＝なし）。ride_004 14:15 の 98 km/h が実速度でなければ 80 などを入れる
  max_gap_sec: 5         # fix 間隔がこれを超える区間は補間しない（has_gps=False）
  speed_smooth_points: 3 # 速度の移動中央値の点数
model:
  speed_bin_kmh: 5       # 速度補正ベースラインのビン幅
  baseline_min_count: 10 # 窓数がこれ未満のビンは最寄りのビンの中央値・MAD を借りる
  z_threshold: 3.0       # z_speed の候補異常しきい値
  anomaly_method: speed_baseline  # 画面の「基準を超えた振動」の判定：speed_baseline（z_speed > z_threshold）か speed_iforest（速度を足した Isolation Forest）。変えたら全走行を点数付けし直す
  anomaly_quantile: 0.999  # speed_iforest のしきい値＝学習に使った窓の score_if のこの分位点（0.999 なら上位 0.1%）。学習のときに求めて model.json に保存する
  contamination: 0.03    # IsolationForest（is_anomaly_if の外れの割合。判定には使わない）
  n_estimators: 300
  random_state: 0
aws:
  env: prod                 # 向き先の環境（prod か test）。--env、環境変数 CT125_ENV、config/local.yaml の aws.env の順に優先。test の値は下の environments
  profile: ct125-logger     # 管理者のプロファイル（機器の登録・公開を Lambda に頼む）。リージョンはプロファイルのもの（ap-northeast-1）
  pipeline_profile: null    # ローカルの処理に使うプロファイル（公開用に書けないロール。docs/data_flow_design.md 11.）。null なら profile
  region: null              # null＝プロファイルの region。明示するならここ
  bucket_name: "ct125-logger-{role}-{account_id}"  # 生データ（raw）・作業用（work）・公開用（public）のバケット名の決まり（infra と同じ）
  raw_prefix: ""
  work_prefix: ""
  public_prefix: "datasets/shared/"
  pipeline_function: ct125-ride-pipeline  # 公開を頼む Lambda
  device_parameter_prefix: /ct125/devices/  # 機器トークンのハッシュを置く SSM の場所（infra の device_token_parameter_prefix と同じ）
environments:            # aws.env が prod 以外のとき、aws と upload に重ねる値（infra/environment.tf の名前の決まりと同じ）
  test:
    aws:
      pipeline_profile: ct125-test-local-pipeline   # test のバケットだけに届くロール（~/.aws/config に作る。docs/test_environment.md）
      bucket_name: "ct125-logger-test-{role}-{account_id}"
      pipeline_function: ct125-test-ride-pipeline
      device_parameter_prefix: /ct125-test/devices/
    upload:
      base_url: https://drive-test.herdio-system.com
      token_file: config/pc01.test.token
bands_hz:                # 帯域エネルギー比（fs ≈ 398 Hz、ナイキスト 199 Hz）
  band_1_5: [1, 5]
  band_5_15: [5, 15]
  band_15_40: [15, 40]
