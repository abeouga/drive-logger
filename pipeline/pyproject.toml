[project]
name = "ct125"
version = "0.1.0"
description = "ハンターカブ CT125 走行データロガー（ESP32 + GPS + ADXL345）の解析パイプライン"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 版を固定する：学習済みモデル（pickle）を、学習したときと同じ版で読むため。Lambda のコンテナ（deploy/lambda/requirements.txt）と同じ版にする
# （tests/test_dependencies.py で突き合わせる）。版を上げたら学習し直す（retrain）。model.json に学習したときの版が残る
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "boto3==1.43.125",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.26", "jupyter", "matplotlib>=3.8", "nbformat", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct125"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
