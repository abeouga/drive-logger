[project]
name = "ct125"
version = "0.1.0"
description = "ハンターカブ CT125 走行データロガー（ESP32 + GPS + ADXL345）の解析パイプライン"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "pyyaml>=6",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.26", "jupyter", "matplotlib>=3.8", "nbformat", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct125"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
