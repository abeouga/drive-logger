[project]
name = "ct125-api"
version = "0.1.0"
description = "CT125 走行データ Web アプリのデータ API（FastAPI。Lambda＋API Gateway で動かす）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",   # Lambda（API Gateway のイベント）を FastAPI につなぐ変換層
    "boto3>=1.35",    # S3 を読む。Lambda にも入っているが、版を固定するため同梱する
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",    # FastAPI の TestClient が使う
    "uvicorn>=0.30",  # ローカルで動かすとき
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct125_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
